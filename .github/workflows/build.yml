name: Construire et publier l'image

# Lancement manuel (onglet Actions > "Run workflow") et a chaque modification
# des fichiers sur la branche main.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Etiquette de la release keryx-miner (ex. v0.5.7-PoM). Vide = la derniere."
        required: false
        default: ""
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: clusmi/vastkeryx

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Trouver la version de keryx-miner
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ github.event.inputs.version }}
        run: |
          chmod +x scripts/*.sh
          args=$(scripts/resolve-versions.sh "$WANTED")
          echo "$args"
          {
            echo "build_args<<EOF"
            echo "$args"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Chaque build est publie sous deux etiquettes : "latest" (vast.ai : recycle)
      # et une etiquette datee (pour revenir a un build precis si besoin).
      - name: Etiquette datee
        id: tag
        env:
          BUILD_ARGS: ${{ steps.versions.outputs.build_args }}
        run: |
          tag=$(date -u +%Y-%m-%d-%H%M)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo "### Image publiee : ${IMAGE}:latest et ${IMAGE}:${tag}"
            echo
            echo "Mineur inclus :"
            echo "$BUILD_ARGS" | grep '_VERSION=' | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et envoyer sur Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          pull: true
          no-cache: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          build-args: ${{ steps.versions.outputs.build_args }}
